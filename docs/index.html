<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>News Research Chatbot</title>
<style>
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto;max-width:780px;margin:40px auto;padding:0 16px}
  textarea{width:100%;height:120px} button{padding:10px 16px;margin-top:8px}
  pre{white-space:pre-wrap;background:#111;color:#eee;padding:12px;border-radius:8px}
</style>
<h1>News Research Chatbot</h1>
<p>Ask anything about the news. This page calls the FastAPI backend.</p>
<textarea id="q">Chandrayaan 3 updates</textarea><br><button id="ask">Ask</button>
<h3>Response</h3><pre id="out">...</pre>
<script>
  const BACKEND = "https://news-research-chatbot.onrender.com";

  document.getElementById('ask').onclick = async () => {
    const out = document.getElementById('out'); out.textContent = "Loading...";
    try {
      const url = new URL("/chat", BACKEND);
      url.searchParams.set("query", document.getElementById('q').value);
      const r = await fetch(url);
      out.textContent = await r.text();
    } catch(e) { out.textContent = "Error: " + e.message; }
  };
</script>
